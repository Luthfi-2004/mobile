<ion-content class="splash-screen" [class.fade-out]="fadeOut" [fullscreen]="true">
  <div class="color-flash" *ngIf="showFlash"></div>

  <div class="logo-container" *ngIf="showLogo">
    <img src="assets/img/logores.png" class="logo" alt="Logo" />
  </div>

  <!-- Audio element dengan multiple formats -->
  <audio #audioPlayer preload="auto" style="display: none;" muted="false">
    <source src="assets/sounds/transisi.mp3" type="audio/mpeg">
    <source src="assets/sounds/transisi.wav" type="audio/wav">
    <source src="assets/sounds/transisi.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>
</ion-content>
